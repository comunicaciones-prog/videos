<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite VA Consulting | Legal Virtual Assistants</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      font-family: 'Montserrat', Arial, sans-serif;
    }

    .email-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .main-flyer {
      width: 100%;
      max-width: 800px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .va-card {
      width: 90%;
      max-width: 720px;
      display: block;
      margin: 10px auto;
      text-decoration: none;
    }

    .va-card img {
      width: 100%;
      height: auto;
      display: block;
      border: 0;
    }

    /* INTERVIEW CTA */
    .cta-title {
      display: inline-block;
      margin: 28px auto 6px;
      padding: 12px 24px;
      background: #d78e05;
      border: 2px solid #ffffff;
      border-radius: 6px;
      color: #ffffff;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      text-decoration: none;
      box-sizing: border-box;
    }

    .cta-subtitle {
      margin: 0 15px 20px;
      color: #090f46;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    /* WEB + MEET */
    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 0 auto 30px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 120px;
      padding: 12px 18px;
      border-radius: 5px;
      background: #090f46;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-sizing: border-box;
    }

    /* WHITE ICONS */
    .icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media only screen and (max-width: 600px) {

      .cta-title {
        font-size: 18px;
        padding: 11px 20px;
      }

      .buttons {
        gap: 10px;
      }

      .action-button {
        min-width: 105px;
        padding: 11px 14px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<div class="email-container">

  <!-- MAIN FLYER -->
  <img
    class="main-flyer"
    src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/part%201%20255.png"
    alt="Bilingual Virtual Assistants for Law Firms - Meet Our VAs"
  >

  <!-- ARALY -->
  <a
    class="va-card"
    href="https://youtu.be/ztvuQVchOK0"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img
      src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/araly%20001.png"
      alt="Araly - Legal Virtual Assistant"
    >
  </a>

  <!-- LAURA -->
  <a
    class="va-card"
    href="https://youtu.be/TJqAyAgVrTk"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img
      src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/laura%20002.png"
      alt="Laura - Legal Virtual Assistant"
    >
  </a>

  <!-- DANIELA -->
  <a
    class="va-card"
    href="https://youtu.be/3aw69RN2YII"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img
      src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/daniela%20002.png"
      alt="Daniela - Legal Virtual Assistant"
    >
  </a>


  <!-- INTERVIEW BUTTON -->
  <a
    class="cta-title"
    href="https://elitevaeasybookings.lovable.app/"
    target="_blank"
    rel="noopener noreferrer"
  >
    Interview a VA this week
  </a>

  <!-- SUBTITLE -->
  <div class="cta-subtitle">
    no commitment.
  </div>


  <!-- WEB + MEET BUTTONS -->
  <div class="buttons">

    <!-- WEB -->
    <a
      class="action-button"
      href="https://www.elitevaconsulting.com/"
      target="_blank"
      rel="noopener noreferrer"
      title="Visit Elite VA Consulting"
    >
      <span class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M3 12h18"></path>
          <path d="M12 3c2.5 2.4 3.8 5.4 3.8 9s-1.3 6.6-3.8 9"></path>
          <path d="M12 3c-2.5 2.4-3.8 5.4-3.8 9s1.3 6.6 3.8 9"></path>
        </svg>
      </span>
      <span>WEB</span>
    </a>


    <!-- MEET -->
    <a
      class="action-button"
      href="https://elitevaeasybookings.lovable.app/"
      target="_blank"
      rel="noopener noreferrer"
      title="Book a VA interview"
    >
      <span class="icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="6" width="13" height="12" rx="2"></rect>
          <path d="M16 10l5-3v10l-5-3z"></path>
        </svg>
      </span>
      <span>MEET</span>
    </a>

  </div>

</div>

</body>
</html>
