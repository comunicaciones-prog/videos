<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite VA Consulting | Legal Virtual Assistants</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    body {
      font-family: 'Montserrat', Arial, sans-serif;
    }

    .email-container {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .main-flyer {
      width: 100%;
      max-width: 800px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .va-card {
      width: 90%;
      max-width: 720px;
      display: block;
      margin: 10px auto;
      text-decoration: none;
    }

    .va-card img {
      width: 100%;
      height: auto;
      display: block;
      border: 0;
    }

    .cta-title {
      margin: 28px 15px 4px;
      color: #090f46;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 700;
    }

    .cta-subtitle {
      margin: 0 15px 18px;
      color: #a46f0b;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 600;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 0 auto 30px;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 115px;
      padding: 12px 18px;
      border-radius: 5px;
      background: #090f46;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Montserrat', Arial, sans-serif;
      font-size: 13px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .icon {
      font-size: 17px;
      line-height: 1;
    }

    @media only screen and (max-width: 600px) {
      .cta-title {
        font-size: 21px;
      }

      .buttons {
        gap: 10px;
      }

      .action-button {
        min-width: 105px;
        padding: 11px 14px;
      }
    }
  </style>
</head>

<body>

<div class="email-container">

  <!-- MAIN FLYER -->
  <img
    class="main-flyer"
    src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/part%201%20255.png"
    alt="Bilingual Virtual Assistants for Law Firms - Meet Our VAs"
  >

  <!-- ARALY -->
  <a
    class="va-card"
    href="https://youtu.be/ztvuQVchOK0"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img
      src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/araly%20001.png"
      alt="Araly - Legal Virtual Assistant"
    >
  </a>

  <!-- LAURA -->
  <a
    class="va-card"
    href="https://youtu.be/TJqAyAgVrTk"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img
      src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/laura%20002.png"
      alt="Laura - Legal Virtual Assistant"
    >
  </a>

  <!-- DANIELA -->
  <a
    class="va-card"
    href="https://youtu.be/3aw69RN2YII"
    target="_blank"
    rel="noopener noreferrer"
  >
    <img
      src="https://raw.githubusercontent.com/comunicaciones-prog/videos/main/daniela%20002.png"
      alt="Daniela - Legal Virtual Assistant"
    >
  </a>

  <!-- CTA -->
  <div class="cta-title">
    Interview a VA this week
  </div>

  <div class="cta-subtitle">
    no commitment.
  </div>

  <!-- WEB + MEET -->
  <div class="buttons">

    <!-- WEB -->
    <a
      class="action-button"
      href="https://www.elitevaconsulting.com/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">🌐</span>
      <span>WEB</span>
    </a>

    <!-- MEET -->
    <a
      class="action-button"
      href="https://elitevaeasybookings.lovable.app/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <span class="icon">▣</span>
      <span>MEET</span>
    </a>

  </div>

</div>

</body>
</html>
